name: Collect ENTSO-E snapshots

on:
  workflow_dispatch:
  repository_dispatch:
    types: [collect-entsoe]
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: entsoe-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      ENTSOE_COUNTRIES: BE,FR,DE
      ENTSOE_TIMEZONE: Europe/Brussels
      ENTSOE_DATA_DIR: data/raw
      ENTSOE_UPDATE_DIR: data/updates
      ENTSOE_UPDATE_MANIFEST: data/update_manifest.csv
      ENTSOE_RUN_HISTORY: data/run_history.csv
      ENTSOE_STATUS_FILE: data/status.json
      ENTSOE_PROGRESS_FILE: data/progress.json
      ENTSOE_FETCH_MODE: recent
      ENTSOE_STORAGE_MODE: snapshot
      ENTSOE_RECENT_DAYS: 31
      ENTSOE_CHUNK_DAYS: 31
      ENTSOE_SLEEP_SECONDS: 1.0
      ENTSOE_MAX_RETRIES: 3
      ENTSOE_RETRY_SLEEP_SECONDS: 5.0
      ENTSOE_MIN_CHUNK_HOURS: 24
      ENTSOE_REQUEST_TIMEOUT_SECONDS: 60
      ENTSOE_MIN_COLLECTION_INTERVAL_MINUTES: 13

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data branch
        run: |
          git fetch origin data --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --no-checkout ../entsoe-data origin/data
            cd ../entsoe-data
            git sparse-checkout set --no-cone \
              /data/update_manifest.csv \
              /data/status.json \
              /data/run_history.csv \
              /data/progress.json
            git checkout
            cd "$GITHUB_WORKSPACE"
            mkdir -p data/updates
            cp -f ../entsoe-data/data/update_manifest.csv data/update_manifest.csv 2>/dev/null || true
            cp -f ../entsoe-data/data/status.json data/status.json 2>/dev/null || true
            cp -f ../entsoe-data/data/run_history.csv data/run_history.csv 2>/dev/null || true
            cp -f ../entsoe-data/data/progress.json data/progress.json 2>/dev/null || true
          else
            git worktree add -b data ../entsoe-data
          fi

      - name: Decide whether collection is due
        id: due
        run: python scripts/should_collect.py

      - name: Fetch latest ENTSO-E snapshots
        if: steps.due.outputs.should_collect == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: python scripts/fetch_once.py

      - name: Commit new snapshot data
        if: steps.due.outputs.should_collect == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          mkdir -p ../entsoe-data/data
          mkdir -p ../entsoe-data/data/updates
          cp -a data/updates/. ../entsoe-data/data/updates/ 2>/dev/null || true
          cp -f data/update_manifest.csv ../entsoe-data/data/update_manifest.csv 2>/dev/null || true
          cp -f data/status.json ../entsoe-data/data/status.json 2>/dev/null || true
          cp -f data/run_history.csv ../entsoe-data/data/run_history.csv 2>/dev/null || true
          cp -f data/progress.json ../entsoe-data/data/progress.json 2>/dev/null || true

          cd ../entsoe-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/updates data/update_manifest.csv data/status.json data/run_history.csv data/progress.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "data: collect ENTSO-E snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:data
          fi
