name: Continuous ENTSO-E collector

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

permissions:
  contents: read

concurrency:
  group: entsoe-continuous-collector
  cancel-in-progress: true

jobs:
  collect-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      ENTSOE_COUNTRIES: BE,FR,DE,NL,DK1,DK2,ES,PT
      ENTSOE_VARIABLES: actual_load,forecast_load,actual_solar_generation,forecast_solar_generation,actual_onshore_wind_generation,forecast_onshore_wind_generation,actual_offshore_wind_generation,forecast_offshore_wind_generation
      ENTSOE_TIMEZONE: Europe/Brussels
      ENTSOE_DATA_DIR: data/raw
      ENTSOE_UPDATE_DIR: data/updates
      ENTSOE_HOURLY_DIR: data/hourly
      ENTSOE_UPDATE_MANIFEST: data/update_manifest.csv
      ENTSOE_RUN_HISTORY: data/run_history.csv
      ENTSOE_STATUS_FILE: data/status.json
      ENTSOE_PROGRESS_FILE: data/progress.json
      ENTSOE_FETCH_MODE: recent
      ENTSOE_STORAGE_MODE: snapshot
      ENTSOE_RECENT_DAYS: 7
      ENTSOE_CHUNK_DAYS: 7
      ENTSOE_SLEEP_SECONDS: 1.0
      ENTSOE_MAX_RETRIES: 3
      ENTSOE_RETRY_SLEEP_SECONDS: 5.0
      ENTSOE_MIN_CHUNK_HOURS: 24
      ENTSOE_REQUEST_TIMEOUT_SECONDS: 60
      ENTSOE_MIN_COLLECTION_INTERVAL_MINUTES: 13

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_PUSH_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data branch
        run: |
          git fetch origin data --filter=blob:none --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --no-checkout ../entsoe-data origin/data
            cd ../entsoe-data
            git sparse-checkout set --no-cone \
              /data/update_manifest.csv \
              /data/status.json \
              /data/run_history.csv \
              /data/progress.json \
              /data/hourly
            git checkout
            cd "$GITHUB_WORKSPACE"
            mkdir -p data/updates
            mkdir -p data/hourly
            cp -f ../entsoe-data/data/update_manifest.csv data/update_manifest.csv 2>/dev/null || true
            cp -f ../entsoe-data/data/status.json data/status.json 2>/dev/null || true
            cp -f ../entsoe-data/data/run_history.csv data/run_history.csv 2>/dev/null || true
            cp -f ../entsoe-data/data/progress.json data/progress.json 2>/dev/null || true
            cp -a ../entsoe-data/data/hourly/. data/hourly/ 2>/dev/null || true
          else
            git worktree add -b data ../entsoe-data
          fi

      - name: Run collection loop
        shell: bash
        run: |
          for iteration in $(seq 1 48); do
            echo "Collection loop iteration ${iteration}/48 at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git -C ../entsoe-data fetch origin data --filter=blob:none --depth=1 || true
            git -C ../entsoe-data reset --hard FETCH_HEAD || true
            mkdir -p data/updates
            mkdir -p data/hourly
            cp -f ../entsoe-data/data/update_manifest.csv data/update_manifest.csv 2>/dev/null || true
            cp -f ../entsoe-data/data/status.json data/status.json 2>/dev/null || true
            cp -f ../entsoe-data/data/run_history.csv data/run_history.csv 2>/dev/null || true
            cp -f ../entsoe-data/data/progress.json data/progress.json 2>/dev/null || true
            cp -a ../entsoe-data/data/hourly/. data/hourly/ 2>/dev/null || true

            due_output="$(python scripts/should_collect.py)"
            echo "${due_output}"
            if echo "${due_output}" | grep -q "should_collect=true"; then
              python scripts/fetch_once.py
              cd ../entsoe-data
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              pushed=false
              for push_attempt in 1 2 3; do
                git fetch origin data --filter=blob:none --depth=1 || true
                git reset --hard origin/data || true

                mkdir -p data/updates data/hourly
                cp -a "$GITHUB_WORKSPACE/data/updates/." data/updates/ 2>/dev/null || true
                cp -a "$GITHUB_WORKSPACE/data/hourly/." data/hourly/ 2>/dev/null || true
                cp -f "$GITHUB_WORKSPACE/data/update_manifest.csv" data/update_manifest.csv 2>/dev/null || true
                cp -f "$GITHUB_WORKSPACE/data/status.json" data/status.json 2>/dev/null || true
                cp -f "$GITHUB_WORKSPACE/data/run_history.csv" data/run_history.csv 2>/dev/null || true
                cp -f "$GITHUB_WORKSPACE/data/progress.json" data/progress.json 2>/dev/null || true

                git add --sparse data/updates data/hourly data/update_manifest.csv data/status.json data/run_history.csv data/progress.json
                if git diff --cached --quiet; then
                  echo "No snapshot changes to commit."
                  pushed=true
                  break
                fi

                git commit -m "data: collect ENTSO-E snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                if git push origin HEAD:data; then
                  pushed=true
                  break
                fi
                echo "Push attempt ${push_attempt} failed; refreshing data branch and retrying."
                sleep $((push_attempt * 10))
              done
              if [ "${pushed}" != "true" ]; then
                echo "Failed to push snapshot data after retries." >&2
                exit 1
              fi
              cd "$GITHUB_WORKSPACE"
              find data/updates -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            else
              echo "Collection not due yet."
            fi

            if [ "${iteration}" != "48" ]; then
              sleep 300
            fi
          done
