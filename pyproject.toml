[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entsoe-realtime-collector"
version = "0.1.0"
description = "Fetch, store, and monitor ENTSO-E load, renewable generation, and price data."
requires-python = ">=3.10"
dependencies = [
  "entsoe-py>=0.6.18",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "streamlit>=1.35",
  "plotly>=5.22",
  "schedule>=1.2",
  "python-irodsclient>=3.2",
  "mango_auth>=0.0.11",
]

[tool.setuptools.packages.find]
where = ["src"]
